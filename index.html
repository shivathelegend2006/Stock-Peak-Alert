<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Stock Peak Alert - Live</title>
    <!-- Typography Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-low": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "secondary": "#006c49",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
        }
        .neon-line {
            filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.75)) drop-shadow(0 0 14px rgba(16, 185, 129, 0.35));
        }
        #chartViewport {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#0b1c30] min-h-screen antialiased flex flex-col font-sans">

<!-- TOP APP BAR -->
<header class="bg-white/95 backdrop-blur-md border-b border-[#e2e8f0] sticky top-0 z-40">
    <div class="flex items-center w-full px-3.5 sm:px-6 md:px-8 max-w-[1600px] mx-auto h-13 sm:h-14">
        <div class="flex items-center space-x-2 sm:space-x-2.5">
            <span class="material-symbols-outlined text-emerald-600 text-xl sm:text-2xl" data-icon="insights">insights</span>
            <span class="text-base sm:text-xl font-bold tracking-tight text-slate-900">Stock Peak Alert</span>
        </div>
    </div>
</header>

<!-- MAIN VIEWPORT CONTAINER -->
<main class="flex-1 max-w-[1600px] w-full mx-auto px-2.5 sm:px-6 md:px-8 py-3.5 sm:py-6 flex flex-col space-y-4 sm:space-y-6">
    
    <!-- THE DARK MARKET GRAPH CARD -->
    <div class="bg-[#090D15] rounded-xl sm:rounded-2xl border border-[rgba(255,255,255,0.08)] shadow-2xl overflow-hidden flex flex-col relative select-none">
        
        <!-- Chart Header with Stock Name, Live Price and Date -->
        <div class="px-3.5 sm:px-6 py-3 sm:py-4 flex justify-between items-center border-b border-[rgba(255,255,255,0.07)] z-10 bg-[#090D15]">
            <div class="min-w-0 pr-2">
                <div class="flex items-center space-x-2 sm:space-x-2.5">
                    <h1 class="text-white font-bold text-base sm:text-xl md:text-2xl tracking-tight truncate">NIFTY 50</h1>
                    <span class="px-1.5 sm:px-2 py-0.5 rounded text-[9px] sm:text-xs font-semibold bg-slate-800/80 text-slate-300 border border-slate-700/80 font-mono shrink-0">^NSEI</span>
                </div>
                <div class="flex flex-wrap items-center mt-1 gap-x-2.5 gap-y-1">
                    <p class="text-slate-400 text-[11px] sm:text-xs font-medium" id="chartDateDisplay">Loading Date...</p>
                    <!-- Weekend Badge -->
                    <span id="weekendBadge" class="hidden px-1.5 py-0.5 rounded text-[9px] sm:text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 tracking-wider">
                        Market Closed
                    </span>
                </div>
            </div>
            
            <!-- Live Price & Status Indicator (Green dot removed) -->
            <div class="text-right shrink-0">
                <div class="flex items-center justify-end mb-0.5">
                    <span class="text-[10px] sm:text-xs font-bold text-emerald-400 uppercase tracking-wider font-mono" id="liveText">LIVE</span>
                </div>
                <div class="text-base sm:text-xl md:text-2xl font-bold font-mono text-white tracking-tight tabular-nums" id="headerPriceDisplay">₹--.--</div>
            </div>
        </div>

        <!-- Chart Wrapper: Interactive Viewport + Right Price Scale -->
        <div class="flex flex-row w-full bg-[#090D15]">
            
            <!-- Interactive Chart Viewport Canvas & SVG -->
            <div class="relative flex-1 min-w-0 h-72 sm:h-80 md:h-[390px] bg-[#090D15] p-0 flex flex-col justify-between cursor-crosshair overflow-hidden touch-none" id="chartViewport">
                
                <!-- SVG Area Container -->
                <div class="relative flex-1 min-h-0 w-full" id="chartCanvasContainer">
                    
                    <!-- Interactive Crosshair Guideline -->
                    <div class="absolute top-0 bottom-0 w-[1px] bg-emerald-400/60 pointer-events-none hidden z-20 border-l border-dashed border-emerald-400" id="crosshairLine"></div>
                    
                    <!-- Floating Interactive Tooltip HUD (Time and Price only) -->
                    <div class="absolute pointer-events-none z-30 hidden transition-all duration-75 ease-out bg-[#0F172A]/95 backdrop-blur-md border border-slate-700/80 rounded-lg shadow-[0_8px_24px_rgba(0,0,0,0.6)] px-3 py-2 text-xs min-w-[125px]" id="chartTooltip">
                        <div class="flex items-center justify-between gap-3 border-b border-white/10 pb-1 mb-1.5 font-mono text-[11px]">
                            <span class="text-slate-400">Time:</span>
                            <span class="text-slate-200 font-semibold tabular-nums" id="tooltipTime">--:--:--</span>
                        </div>
                        <div class="flex items-baseline justify-between gap-3 font-mono" id="tooltipPriceRow">
                            <span class="text-slate-400 text-[11px]">Price:</span>
                            <span class="text-white font-bold text-xs sm:text-sm tabular-nums" id="tooltipPrice">₹--.--</span>
                        </div>
                        <!-- Hidden elements for backward compatibility -->
                        <span id="tooltipTicker" class="hidden">NIFTY</span>
                        <span id="tooltipAnomalyBadge" class="hidden"></span>
                        <div id="tooltipAnomalyRow" class="hidden"></div>
                    </div>
                    
                    <!-- Live Hover Snag Dot Indicator -->
                    <div class="absolute w-2.5 h-2.5 sm:w-3 sm:h-3 -ml-1.5 -mt-1.5 rounded-full bg-emerald-400 border-2 border-white shadow-[0_0_12px_#10b981] pointer-events-none hidden z-25" id="cursorHoverDot"></div>
                    
                    <!-- SVG Chart Canvas -->
                    <svg class="w-full h-full block" id="chartSvg" preserveAspectRatio="none" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Neon Emerald Green Area Gradient -->
                            <linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"></stop>
                                <stop offset="65%" stop-color="#10b981" stop-opacity="0.06"></stop>
                                <stop offset="100%" stop-color="#10b981" stop-opacity="0.00"></stop>
                            </linearGradient>
                            <filter height="200%" id="emeraldGlow" width="200%" x="-50%" y="-50%">
                                <feGaussianBlur result="coloredBlur" stdDeviation="3.5"></feGaussianBlur>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"></feMergeNode>
                                    <feMergeNode in="coloredBlur"></feMergeNode>
                                    <feMergeNode in="SourceGraphic"></feMergeNode>
                                </feMerge>
                            </filter>
                            <!-- Red Anomaly Glow Filter -->
                            <filter height="200%" id="redGlow" width="200%" x="-50%" y="-50%">
                                <feGaussianBlur result="coloredBlur" stdDeviation="4"></feGaussianBlur>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"></feMergeNode>
                                    <feMergeNode in="coloredBlur"></feMergeNode>
                                    <feMergeNode in="SourceGraphic"></feMergeNode>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Horizontal Grid Lines (aligned exactly with the 5 price scale ticks) -->
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.65" x1="0" x2="1000" y1="22" y2="22"></line>
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.65" x1="0" x2="1000" y1="86" y2="86"></line>
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.65" x1="0" x2="1000" y1="150" y2="150"></line>
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.65" x1="0" x2="1000" y1="214" y2="214"></line>
                        <line stroke="#1E293B" stroke-width="1" stroke-opacity="0.65" x1="0" x2="1000" y1="278" y2="278"></line>
                        
                        <!-- Vertical Reference Grid Lines -->
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.45" x1="200" x2="200" y1="15" y2="278"></line>
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.45" x1="400" x2="400" y1="15" y2="278"></line>
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.45" x1="600" x2="600" y1="15" y2="278"></line>
                        <line stroke="#1E293B" stroke-dasharray="3 3" stroke-width="1" stroke-opacity="0.45" x1="800" x2="800" y1="15" y2="278"></line>
                        
                        <!-- Price Area Fill -->
                        <path d="" fill="url(#areaGradient)" id="chartAreaPath"></path>
                        <!-- Crisp Neon Emerald Price Line -->
                        <path class="neon-line" d="" fill="none" id="chartLinePath" stroke="#10b981" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
                        <!-- Static Peak Anomaly Markers (Distinguishable RED) -->
                        <g id="anomalyMarkersGroup"></g>
                    </svg>
                </div>
                
                <!-- Bottom X-Axis Timestamps (Dynamic Time Labels) -->
                <div class="h-6 sm:h-7 shrink-0 border-t border-[rgba(255,255,255,0.07)] bg-[#090D15]/95 z-10 flex items-center">
                    <div id="xAxisLabels" class="w-full flex justify-between items-center px-4 sm:px-8 text-[10px] sm:text-xs font-mono font-medium tabular-nums text-slate-400">
                        <!-- Populated dynamically by JS -->
                    </div>
                </div>
            </div>

            <!-- Dedicated Right-Hand Price Scale Column (Thinned on mobile: w-12 sm:w-20) -->
            <div class="order-last w-12 sm:w-20 shrink-0 bg-[#090D15] border-l border-[rgba(255,255,255,0.07)] flex flex-col select-none pointer-events-none z-10">
                <!-- Top Price Scale Container (Height matches SVG area) -->
                <div id="priceScaleColumn" class="relative flex-1 min-h-0 w-full overflow-hidden text-[10px] sm:text-xs font-mono text-slate-400 text-right">
                    <span>--</span>
                    <span>--</span>
                    <span>--</span>
                    <span>--</span>
                    <span>--</span>
                </div>
                <!-- Bottom Spacer (Height matches X-Axis bar) -->
                <div class="h-6 sm:h-7 shrink-0 border-t border-[rgba(255,255,255,0.07)]"></div>
            </div>

        </div>
    </div>

    <!-- ANOMALIES DETECTED SECTION -->
    <div class="bg-white border border-[#e2e8f0] rounded-xl sm:rounded-2xl overflow-hidden shadow-sm flex flex-col">
        <div class="px-3.5 sm:px-5 py-3 sm:py-3.5 border-b border-[#e2e8f0] flex items-center justify-between bg-white">
            <div class="flex items-center space-x-2">
                <span class="material-symbols-outlined text-emerald-600 text-xl" data-icon="radar">radar</span>
                <h2 class="text-sm sm:text-base font-bold text-slate-900">Anomalies Detected</h2>
            </div>
        </div>
        <div class="overflow-x-auto w-full">
            <table class="w-full min-w-full text-left border-collapse" id="anomalyTable">
                <thead>
                    <tr class="border-b border-[#e2e8f0] bg-[#f8fafc] text-slate-600 text-xs font-semibold">
                        <th class="py-2.5 sm:py-3 px-3 sm:px-6 whitespace-nowrap">Time</th>
                        <th class="py-2.5 sm:py-3 px-3 sm:px-6 whitespace-nowrap">Detection Price</th>
                        <th class="py-2.5 sm:py-3 px-3 sm:px-6 whitespace-nowrap">Confidence</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#e2e8f0] text-xs sm:text-sm" id="anomalyLogBody">
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    // --- 1. STATE INITIALIZATION ---
    let dataset = [];
    let anomalyTableIndices = [];
    let minPrice = Infinity;
    let maxPrice = -Infinity;
    
    const svgWidth = 1000;
    const svgHeight = 290;
    const paddingX = 25; 
    const topY = 22;     // Aligned to Grid Line 0 (Max Price)
    const bottomY = 278;  // Aligned to Grid Line 4 (Min Price)
    const MAX_DATA_POINTS = 400; 
    let tableRowCounter = 0;

    // --- 2. DYNAMIC COORDINATE MATH ---
    function getCoordinates(index, price) {
        const indexRatio = dataset.length > 1 ? index / (dataset.length - 1) : 0;
        const x = paddingX + indexRatio * (svgWidth - paddingX * 2);
        const priceRange = (maxPrice - minPrice) === 0 ? 1 : (maxPrice - minPrice);
        const normalizedPrice = (price - minPrice) / priceRange;
        const y = bottomY - normalizedPrice * (bottomY - topY);
        return { x, y };
    }

    // --- 3. DYNAMIC Y-AXIS (PRICE SCALE) UPDATE ---
    function updatePriceScale() {
        const scaleDiv = document.getElementById('priceScaleColumn');
        if (!scaleDiv || dataset.length === 0) return;
        
        const range = maxPrice - minPrice;
        const step = range / 4;
        
        const prices = [
            maxPrice,
            maxPrice - step,
            maxPrice - step * 2,
            minPrice + step,
            minPrice
        ];
        
        // Grid lines are positioned at: 22/290 (7.6%), 86/290 (29.7%), 150/290 (51.7%), 214/290 (73.8%), 278/290 (95.9%)
        const positions = [7.6, 29.7, 51.7, 73.8, 95.9];
        
        const isMobile = window.innerWidth < 640;
        
        let kDecimals = 1;
        if (isMobile) {
            for (let dec = 1; dec <= 3; dec++) {
                const formatted = prices.map(p => (p / 1000).toFixed(dec) + 'k');
                const hasDuplicates = new Set(formatted).size < formatted.length;
                if (!hasDuplicates) {
                    kDecimals = dec;
                    break;
                }
                kDecimals = dec;
            }
        }

        const formatPrice = (val) => {
            if (isNaN(val)) return '--';
            // IN MOBILE VIEW ALONE: format numbers in K form (e.g. 24.83k)
            if (isMobile) {
                return (val / 1000).toFixed(kDecimals) + 'k';
            }
            // Desktop: full formatted digits with commas
            return val.toLocaleString('en-IN', {
                minimumFractionDigits: 1,
                maximumFractionDigits: 1
            });
        };
        
        scaleDiv.innerHTML = prices.map((p, idx) => `
            <span class="absolute right-1 sm:right-2 font-mono text-[10px] sm:text-xs text-slate-400 tabular-nums whitespace-nowrap -translate-y-1/2 select-none" style="top: ${positions[idx]}%">
                ${formatPrice(p)}
            </span>
        `).join('');
    }

    // --- 3.5 DYNAMIC X-AXIS (TIME SCALE) UPDATE ---
    function updateXAxisLabels() {
        const xAxisContainer = document.getElementById('xAxisLabels');
        if (!xAxisContainer || dataset.length < 2) {
            if (xAxisContainer) xAxisContainer.innerHTML = '';
            return;
        }
        
        // Use 3 timestamps on mobile (<640px) for clean spacing; 5 on larger screens
        const isMobile = window.innerWidth < 640;
        const numLabels = isMobile ? 3 : 5;
        
        let html = '';
        for (let i = 0; i < numLabels; i++) {
            const dataIndex = Math.round(i * (dataset.length - 1) / (numLabels - 1));
            const cleanTime = dataset[dataIndex].time.substring(0, 5);
            html += `<span class="font-mono text-[10px] sm:text-xs text-slate-400 tabular-nums">${cleanTime}</span>`;
        }
        xAxisContainer.innerHTML = html;
    }

    // Update responsive scales on window resize
    window.addEventListener('resize', () => {
        updatePriceScale();
        updateXAxisLabels();
    });

    // --- 4. RENDER SVG CHART ---
    function renderChart() {
        const chartLine = document.getElementById('chartLinePath');
        const chartArea = document.getElementById('chartAreaPath');
        const anomalyGroup = document.getElementById('anomalyMarkersGroup');

        if (!chartLine || !chartArea || dataset.length === 0) return;

        let lineD = '';
        let areaD = '';

        dataset.forEach((d, i) => {
            if (i === 0) {
                lineD += `M ${d.x} ${d.y}`;
                areaD += `M ${d.x} ${bottomY} L ${d.x} ${d.y}`;
            } else {
                const prev = dataset[i - 1];
                const cpX1 = prev.x + (d.x - prev.x) / 2;
                const cpX2 = cpX1;
                lineD += ` C ${cpX1} ${prev.y}, ${cpX2} ${d.y}, ${d.x} ${d.y}`;
                areaD += ` C ${cpX1} ${prev.y}, ${cpX2} ${d.y}, ${d.x} ${d.y}`;
            }
        });

        areaD += ` L ${dataset[dataset.length - 1].x} ${bottomY} Z`;
        chartLine.setAttribute('d', lineD);
        chartArea.setAttribute('d', areaD);

        // Prominent, distinguishable RED anomaly pointers
        let anomalyHtml = '';
        dataset.forEach((d, idx) => {
            if (d.isAnomaly) {
                anomalyHtml += `
                    <g class="anomaly-marker cursor-pointer" data-index="${idx}">
                        <line x1="${d.x}" x2="${d.x}" y1="${d.y + 5}" y2="${bottomY}" stroke="#ef4444" stroke-dasharray="2 3" stroke-width="1.5" opacity="0.6"/>
                        <circle cx="${d.x}" cy="${d.y}" r="8.5" fill="#ef4444" opacity="0.25"/>
                        <circle cx="${d.x}" cy="${d.y}" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.8" filter="url(#redGlow)"/>
                        <circle cx="${d.x}" cy="${d.y}" r="1.5" fill="#ffffff"/>
                    </g>
                `;
            }
        });
        anomalyGroup.innerHTML = anomalyHtml;
    }

    // --- 5. HELPER FUNCTIONS FOR DATA INJECTION ---
    const tbody = document.getElementById('anomalyLogBody');

    function addDataPoint(data) {
        dataset.push({
            time: data.time,
            price: data.price,
            isAnomaly: Boolean(data.alert),
            confidence: data.confidence,
            type: data.alert ? 'Anomaly' : 'Nominal'
        });

        if (dataset.length > MAX_DATA_POINTS) {
            dataset.shift();
            anomalyTableIndices = anomalyTableIndices.map(idx => idx - 1);
        }

        // Keep header price updated
        const headerPrice = document.getElementById('headerPriceDisplay');
        if (headerPrice && typeof data.price === 'number') {
            headerPrice.textContent = `₹${data.price.toFixed(2)}`;
        }
    }

    function addAnomalyRow(data, targetIndex) {
        if (!tbody) return;
        anomalyTableIndices.unshift(targetIndex);
        const row = document.createElement('tr');
        row.className = "hover:bg-[#f8fafc] transition-colors duration-150 cursor-pointer border-b border-[#e2e8f0]";
        row.setAttribute("onclick", `highlightChartPoint(${tableRowCounter})`);
        
        const barWidth = Math.min(Math.max(data.confidence * 10, 8), 100);
        // Confidence bar: Gradient mix of emerald, teal and blue
        row.innerHTML = `
            <td class="py-2.5 sm:py-3 px-3 sm:px-6 font-mono font-semibold tabular-nums whitespace-nowrap text-slate-800">${data.time}</td>
            <td class="py-2.5 sm:py-3 px-3 sm:px-6 tabular-nums whitespace-nowrap font-mono">
                <span class="font-medium text-slate-900">₹${data.price.toFixed(2)}</span>
            </td>
            <td class="py-2.5 sm:py-3 px-3 sm:px-6 whitespace-nowrap">
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <div class="w-16 sm:w-24 bg-slate-100 h-2 rounded-full overflow-hidden border border-slate-200">
                        <div class="bg-gradient-to-r from-emerald-500 via-teal-500 to-blue-500 h-full rounded-full" style="width: ${barWidth}%;"></div>
                    </div>
                    <span class="font-bold text-emerald-700 text-xs font-mono">${data.confidence.toFixed(2)}</span>
                </div>
            </td>
        `;
        tbody.insertBefore(row, tbody.firstChild);
        tableRowCounter++;
        if (tbody.children.length > 50) tbody.removeChild(tbody.lastChild);
    }

    function refreshVisualization() {
        if (dataset.length === 0) return;
        const prices = dataset.map(d => d.price);
        const rawMin = Math.min(...prices);
        const rawMax = Math.max(...prices);
        const range = rawMax - rawMin;

        // Tight bottom margin to minimize empty space at the bottom half without clipping
        const bottomMargin = Math.max(range * 0.015, 0.15);
        const topMargin = Math.max(range * 0.05, 0.4);
        
        minPrice = rawMin - bottomMargin;
        maxPrice = rawMax + topMargin;

        dataset.forEach((d, i) => {
            const coords = getCoordinates(i, d.price);
            d.x = coords.x;
            d.y = coords.y;
        });

        updatePriceScale();
        updateXAxisLabels();
        renderChart();

        // Update header price to latest
        const latestPoint = dataset[dataset.length - 1];
        const headerPrice = document.getElementById('headerPriceDisplay');
        if (headerPrice && latestPoint) {
            headerPrice.textContent = `₹${latestPoint.price.toFixed(2)}`;
        }
    }

    // --- 6. WEBSOCKET LOGIC (THE CONNECTION) ---
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

    ws.onmessage = function(event) {
        const payload = JSON.parse(event.data);

        if (payload.type === "history") {
            document.getElementById('chartDateDisplay').textContent = payload.date;
            
            const weekendBadge = document.getElementById('weekendBadge');
            const liveText = document.getElementById('liveText');
            
            if (payload.is_weekend) {
                weekendBadge.classList.remove('hidden');
                if (liveText) {
                    liveText.textContent = "CLOSED";
                    liveText.className = "text-[10px] sm:text-xs font-bold text-amber-400 uppercase tracking-wider font-mono";
                }
            } else {
                weekendBadge.classList.add('hidden');
                if (liveText) {
                    liveText.textContent = "LIVE";
                    liveText.className = "text-[10px] sm:text-xs font-bold text-emerald-400 uppercase tracking-wider font-mono";
                }
            }

            dataset = [];
            anomalyTableIndices = [];
            if (tbody) tbody.innerHTML = '';
            tableRowCounter = 0;

            payload.points.forEach(pt => addDataPoint(pt));
            
            payload.anomalies.forEach((anom) => {
                const targetIdx = dataset.findIndex(d => d.time === anom.time);
                addAnomalyRow(anom, targetIdx !== -1 ? targetIdx : dataset.length - 1);
            });

            refreshVisualization();
            
        } else if (payload.type === "tick") {
            addDataPoint(payload);
            refreshVisualization();
            if (payload.alert) {
                addAnomalyRow(payload, dataset.length - 1);
            }
        }
    };

    // --- 7. INTERACTIVE TOOLTIP HUD LOGIC ---
    const viewport = document.getElementById('chartViewport');
    const chartSvg = document.getElementById('chartSvg');
    const crosshair = document.getElementById('crosshairLine');
    const tooltip = document.getElementById('chartTooltip');
    const hoverDot = document.getElementById('cursorHoverDot');
    let touchTimeout = null;

    function resetTooltip() {
        if (crosshair) crosshair.classList.add('hidden');
        if (hoverDot) hoverDot.classList.add('hidden');
        if (tooltip) tooltip.classList.add('hidden');

        // Restore header latest price
        if (dataset.length > 0) {
            const latest = dataset[dataset.length - 1];
            const headerPrice = document.getElementById('headerPriceDisplay');
            if (headerPrice) headerPrice.textContent = `₹${latest.price.toFixed(2)}`;
        }
    }

    function updateTooltipPosition(index) {
        if (index < 0 || index >= dataset.length) return;
        const d = dataset[index];
        if (!d) return;

        const svgRect = chartSvg.getBoundingClientRect();
        const pixelX = (d.x / svgWidth) * svgRect.width;
        const pixelY = (d.y / svgHeight) * svgRect.height;

        crosshair.style.left = `${pixelX}px`;
        crosshair.classList.remove('hidden');

        hoverDot.style.left = `${pixelX}px`;
        hoverDot.style.top = `${pixelY}px`;
        if (d.isAnomaly) {
            hoverDot.className = "absolute w-3 h-3 -ml-1.5 -mt-1.5 rounded-full bg-rose-500 border-2 border-white shadow-[0_0_12px_#ef4444] pointer-events-none z-25";
        } else {
            hoverDot.className = "absolute w-2.5 h-2.5 sm:w-3 sm:h-3 -ml-1.5 -mt-1.5 rounded-full bg-emerald-400 border-2 border-white shadow-[0_0_12px_#10b981] pointer-events-none z-25";
        }
        hoverDot.classList.remove('hidden');

        // Only show Time and Price
        document.getElementById('tooltipTime').textContent = `${d.time}`;
        document.getElementById('tooltipPrice').textContent = `₹${d.price.toFixed(2)}`;

        tooltip.classList.remove('hidden');

        const ttWidth = tooltip.offsetWidth || 125;
        const ttHeight = tooltip.offsetHeight || 48;

        // Horizontally centered on crosshair, clamped to margins
        let ttX = pixelX - ttWidth / 2;
        if (ttX < 6) ttX = 6;
        if (ttX + ttWidth > svgRect.width - 6) ttX = svgRect.width - ttWidth - 6;

        // Position vertically: above the point/finger, or flip below if near the top
        let ttY = pixelY - ttHeight - 14;
        if (ttY < 6) {
            ttY = pixelY + 16;
        }

        tooltip.style.transform = `translate(${ttX}px, ${ttY}px)`;

        // Reflect scrubbed price in header
        const headerPrice = document.getElementById('headerPriceDisplay');
        if (headerPrice) headerPrice.textContent = `₹${d.price.toFixed(2)}`;
    }

    function handleInteraction(clientX) {
        if (dataset.length === 0) return;
        const svgRect = chartSvg.getBoundingClientRect();
        const mouseX = clientX - svgRect.left;
        const svgRelativeX = (mouseX / svgRect.width) * svgWidth;

        let nearestIdx = 0;
        let nearestDist = Infinity;
        dataset.forEach((d, idx) => {
            const dist = Math.abs(d.x - svgRelativeX);
            if (dist < nearestDist) {
                nearestDist = dist;
                nearestIdx = idx;
            }
        });
        updateTooltipPosition(nearestIdx);
    }

    viewport.addEventListener('mousemove', (e) => handleInteraction(e.clientX));
    viewport.addEventListener('mouseleave', resetTooltip);

    viewport.addEventListener('touchstart', (e) => {
        if (touchTimeout) clearTimeout(touchTimeout);
        if (e.touches.length > 0) handleInteraction(e.touches[0].clientX);
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) handleInteraction(e.touches[0].clientX);
    }, { passive: true });

    viewport.addEventListener('touchend', () => {
        touchTimeout = setTimeout(resetTooltip, 3000);
    });

    function highlightChartPoint(tableIndex) {
        const dsIndex = anomalyTableIndices[tableIndex];
        if (dsIndex !== undefined && dsIndex >= 0) {
            updateTooltipPosition(dsIndex);
            if (window.innerWidth < 640) viewport.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    window.highlightChartPoint = highlightChartPoint;

    document.getElementById('anomalyMarkersGroup').addEventListener('click', (e) => {
        const target = e.target.closest('.anomaly-marker');
        if (target) updateTooltipPosition(parseInt(target.getAttribute('data-index'), 10));
    });
</script>
</body>
</html>
